[package]
name = "services"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
futures.workspace = true
zbus.workspace = true
futures-signals.workspace = true
tracing.workspace = true
itertools.workspace = true
chrono.workspace = true
hyprland = { workspace = true, optional = true }
conchy-ipc.workspace = true
vpnx-client.workspace = true
# io-util: the async reads and writes clipboard and polkit use; without it this
# crate only built inside the workspace, where another crate enabled it.
tokio = { workspace = true, features = ["io-util"] }
inotify.workspace = true
kdl.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "bmp"] }

pipewire = "0.10"
libc = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1"
serde-saphyr = "0.0"
sysinfo = "0.39"
udev = "0.9"
libpulse-binding = "2.30"

[features]
# Hyprland backend (hyprctl, hyprpaper) for development on a Hyprland desktop.
# Conchy OS ships Conchy WM, so it is off by default.
hyprland = ["dep:hyprland"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
