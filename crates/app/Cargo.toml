[package]
name = "conchy-shell"
version = "0.1.0"
edition = "2024"
authors = ["Conchy OS Team <team@conchy-os.org>"]
description = "GPU-accelerated desktop shell, status bar, OSD, and control center for Conchy OS"
license = "GPL-3.0-or-later"
repository = "https://github.com/conchy-os/conchy-shell"

[[bin]]
name = "conchy-shell"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
reqwest_client.workspace = true
ui.workspace = true
assets.workspace = true
services.workspace = true
conchy-ipc.workspace = true
conchy-config.workspace = true
zbus.workspace = true
futures.workspace = true
anyhow.workspace = true
futures-util.workspace = true
futures-signals.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
hyprland.workspace = true
tokio.workspace = true
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", features = ["preserve_order"] }
toml_edit = { version = "0.25", features = ["serde"] }
kdl = { workspace = true }
image.workspace = true
uuid.workspace = true
nucleo-matcher = "0.3"

[dev-dependencies]
tempfile = "3"
