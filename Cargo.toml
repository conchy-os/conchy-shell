[workspace]
members = ["crates/*"]
default-members = ["crates/app"]
resolver = "3"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "347f171a3fd00a3b672382d78348b37bd969d17c", features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "347f171a3fd00a3b672382d78348b37bd969d17c", features = ["wayland"] }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "347f171a3fd00a3b672382d78348b37bd969d17c" }
ui = { path = "crates/ui" }
assets = { path = "crates/assets" }
services = { path = "crates/services" }

anyhow = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process"] }
futures-util = { version = "0.3", default-features = false }
futures-signals = "0.3"
futures = "0.3"
inotify = "0.11"
zbus = "5.18"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
itertools = "0.15"
chrono = "0.4"
hyprland = "0.4.0-beta.3"
conchy-ipc = { path = "../compositor/conchy-ipc" }
conchy-config = { path = "../config" }
serde_json = "1.0"
image = { version = "0.25", default-features = false }
uuid = { version = "1", features = ["v5"] }
kdl = "4.7"

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
incremental = false
opt-level = "z"
strip = true
rpath = false
debug = false
debug-assertions = false
overflow-checks = false
