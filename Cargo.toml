[package]
name = "conchy-shell"
version = "0.1.0"
edition = "2021"
authors = ["Conchy OS Team <team@conchy-os.org>"]
description = "Minimalist desktop shell, status bar, OSD, and control center for Conchy OS"
license = "GPL-3.0-or-later"
repository = "https://github.com/conchy-os/conchy-shell"

[dependencies]
anyhow = "1.0"
conchy-ipc = { path = "../compositor/conchy-ipc" }
conchy-config = { path = "../config" }
tokio = { version = "1.43", features = ["full"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.5", default-features = false, features = ["tokio"] }
kdl = "4.7"

[[bin]]
name = "conchy-shell"
path = "src/main.rs"

[lib]
name = "conchy_shell"
path = "src/lib.rs"
